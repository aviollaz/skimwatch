name: deep scan (catálogo completo)
on:
  push:
    branches: [deep-scan]
  workflow_dispatch:
permissions:
  contents: write   # solo para publicar el progreso (conteos) en ramas progress-<tienda>
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        store: [jumbo, disco, vea, carrefour]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Escanear ${{ matrix.store }}
        env:
          S: ${{ matrix.store }}
          GH_TOKEN: ${{ github.token }}
        run: |
          publish() {
            [ -f "out/$S/progress.log" ] || return 0
            d=$(mktemp -d)
            tail -n 25 "out/$S/progress.log" > "$d/progress.txt"
            [ -f "out/$S/summary.json" ] && cp "out/$S/summary.json" "$d/"
            # Los hallazgos (nombres de productos, payloads) van cifrados: el repo es público.
            # Solo quien tiene la clave privada de deep-scan/results-pubkey.pem puede leerlos.
            if [ -f "out/$S/findings.jsonl" ]; then
              tar -czf "$d/f.tgz" -C "out/$S" findings.jsonl findings.csv payloads 2>/dev/null || true
              openssl rand -hex 32 > "$d/k"
              openssl enc -aes-256-cbc -pbkdf2 -salt -in "$d/f.tgz" -out "$d/findings.tgz.enc" -pass file:"$d/k"
              openssl pkeyutl -encrypt -pubin -inkey deep-scan/results-pubkey.pem -pkeyopt rsa_padding_mode:oaep -in "$d/k" -out "$d/key.enc"
              rm -f "$d/f.tgz" "$d/k"
            fi
            ( cd "$d" && git init -q && git add . && git -c user.name=deep-scan -c user.email=deep-scan@users.noreply.github.com commit -qm "progreso $S" \
              && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:refs/heads/progress-$S ) || true
          }
          ( while true; do sleep 120; publish; done ) &
          LOOP=$!
          python deep-scan/deep_scan.py --stores "$S" --redact --every 60 --out "out/$S"
          kill $LOOP || true
          publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-scan-${{ matrix.store }}
          path: out/
          retention-days: 7
