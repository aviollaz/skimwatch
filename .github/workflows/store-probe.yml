name: store probe
on:
  push:
    branches: [store-scan]
    paths: [stores/probe.py, .github/workflows/store-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python stores/probe.py
      - name: Publicar (cifrado)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: stores/publish.sh probe2 out/probe2 0
