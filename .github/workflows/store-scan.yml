name: store scan
on:
  push:
    branches: [store-scan]
    paths: [stores/*_scan.py, .github/workflows/store-scan.yml]
  workflow_dispatch:
permissions:
  contents: write   # publicar resultados (cifrados) en la rama scan-results
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        store: [compragamer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Escanear ${{ matrix.store }}
        run: python stores/${{ matrix.store }}_scan.py
      - name: Publicar resultados cifrados
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: stores/publish.sh ${{ matrix.store }} out/${{ matrix.store }} 1
