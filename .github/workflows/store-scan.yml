name: store scan
on:
  push:
    branches: [store-scan]
    paths: [stores/*_scan.py, .github/workflows/store-scan.yml]
  workflow_dispatch:
permissions:
  contents: write   # publicar resultados cifrados en ramas progress-<tienda>
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        store: [compragamer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Escanear ${{ matrix.store }}
        run: python stores/${{ matrix.store }}_scan.py
      - name: Publicar resultados cifrados
        if: always()
        env:
          S: ${{ matrix.store }}
          GH_TOKEN: ${{ github.token }}
        run: |
          d=$(mktemp -d)
          cp out/$S/summary.json "$d/" 2>/dev/null || true
          tar -czf "$d/f.tgz" -C out "$S"
          openssl rand -hex 32 > "$d/k"
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$d/f.tgz" -out "$d/findings.tgz.enc" -pass file:"$d/k"
          openssl pkeyutl -encrypt -pubin -inkey deep-scan/results-pubkey.pem -pkeyopt rsa_padding_mode:oaep -in "$d/k" -out "$d/key.enc"
          rm -f "$d/f.tgz" "$d/k"
          cd "$d" && git init -q && git add . && git -c user.name=store-scan -c user.email=store-scan@users.noreply.github.com commit -qm "resultados $S" \
            && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:refs/heads/progress-$S
